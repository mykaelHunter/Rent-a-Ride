# kind cluster topology for Rent-a-Ride
# 1 control-plane node + 2 worker nodes
#
# Create with:
#   kind create cluster --name rent-a-ride --config kind-config.yaml
#
# NodePorts 30080/30300 (frontend/backend, direct) work fine as plain
# NodePort + extraPortMappings. The ingress-nginx controller does NOT use
# that pattern - see the README's Ingress section for why - and instead
# uses hostNetwork + a node label, per kind's own documented approach:
# https://kind.sigs.k8s.io/docs/user/ingress/
#
# IMPORTANT: extraPortMappings AND node labels only take effect at
# cluster-creation time. Changing either after the cluster already exists
# does nothing - delete and recreate for a change here to actually apply.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rent-a-ride
nodes:
  - role: control-plane
    # Required so the kind-provider ingress-nginx manifest's nodeSelector
    # (ingress-ready: "true") schedules the controller onto this specific
    # node - the same node these hostPorts are bound on.
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 30080   # -> blue frontend NodePort (direct)
        hostPort: 30080
        protocol: TCP
      - containerPort: 30300   # -> blue backend NodePort (direct)
        hostPort: 30300
        protocol: TCP
      - containerPort: 30081   # -> green frontend NodePort (direct)
        hostPort: 30081
        protocol: TCP
      - containerPort: 30301   # -> green backend NodePort (direct)
        hostPort: 30301
        protocol: TCP
      - containerPort: 30030   # -> Grafana NodePort (direct)
        hostPort: 30030
        protocol: TCP
      # ingress-nginx controller, via hostNetwork: true (NOT a NodePort) -
      # the controller binds these ports directly on this node's own
      # network namespace, so containerPort must match the ports the
      # controller container itself listens on (80/443), not an arbitrary
      # NodePort number.
      - containerPort: 80
        hostPort: 31080
        protocol: TCP
      - containerPort: 443
        hostPort: 31443
        protocol: TCP
  - role: worker
  - role: worker
