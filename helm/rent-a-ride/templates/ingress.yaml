{{- if .Values.ingress.enabled }}
# Requires the AWS Load Balancer Controller to be installed in-cluster
# first (see infra/modules/eks) - it watches this object and provisions
# the actual ALB/target group/listener to match.
#
# No rewrite-target annotation is used: the backend's own Express routes
# are already mounted under /api/* (the same assumption client/nginx.conf's
# own proxy_pass relies on), so the full incoming path, /api included, is
# what the backend expects to receive.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ include "rent-a-ride.namespace" . }}
  labels:
    {{- include "rent-a-ride.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.rollout.enabled }}
    # Weighted target-group actions - the actual blue/green traffic
    # split. servicePort "use-annotation" tells the ALB controller "don't
    # look up a normal Service port, read the split from this action
    # instead." Shifting rollout.weights.blue/green in values.yaml and
    # running `helm upgrade` (or letting ArgoCD sync it) is the entire
    # cutover - same ALB, same listener, same DNS name throughout.
    alb.ingress.kubernetes.io/actions.backend-rollout: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
            {"serviceName": "{{ .Values.backend.name }}", "servicePort": {{ .Values.backend.service.port }}, "weight": {{ .Values.rollout.weights.blue }}},
            {"serviceName": "{{ .Values.backendGreen.name }}", "servicePort": {{ .Values.backend.service.port }}, "weight": {{ .Values.rollout.weights.green }}}
          ]
        }
      }
    alb.ingress.kubernetes.io/actions.frontend-rollout: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
            {"serviceName": "{{ .Values.frontend.name }}", "servicePort": {{ .Values.frontend.service.port }}, "weight": {{ .Values.rollout.weights.blue }}},
            {"serviceName": "{{ .Values.frontendGreen.name }}", "servicePort": {{ .Values.frontend.service.port }}, "weight": {{ .Values.rollout.weights.green }}}
          ]
        }
      }
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if $.Values.rollout.enabled }}
                name: {{ if eq .service "backend" }}backend-rollout{{ else }}frontend-rollout{{ end }}
                port:
                  name: use-annotation
                {{- else }}
                name: {{ if eq .service "backend" }}{{ $.Values.backend.name }}{{ else }}{{ $.Values.frontend.name }}{{ end }}
                port:
                  number: {{ .port }}
                {{- end }}
          {{- end }}
{{- end }}
