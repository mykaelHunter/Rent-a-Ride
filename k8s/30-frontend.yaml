apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rent-a-ride
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Pulled from Docker Hub. VITE_* values are baked in at image
          # build time (see client/Dockerfile) - nothing runtime-configurable
          # here, matching how the image was built by the Jenkins pipeline.
          image: mykaelhunter/rent-a-ride-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
# NodePort - reachable at http://<EC2-PUBLIC-IP>:30080 (mapped through
# kind-config.yaml's extraPortMappings on the control-plane node). This is
# the app's actual entry point; nginx.conf inside the image proxies
# /api/* through to the "backend" ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rent-a-ride
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
