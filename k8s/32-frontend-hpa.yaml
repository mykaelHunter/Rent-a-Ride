# Scales the frontend Deployment (30-frontend.yaml) based on CPU
# utilization against its requested cpu: 50m. nginx serving static assets
# is CPU-bound almost entirely on request volume and rarely leaks memory
# the way a Node process can, so this one tracks CPU only.
#
# Requires the metrics-server addon - see k8s/README.md's "Autoscaling"
# section.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: rent-a-ride
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
