# Requires the ingress-nginx controller to be installed in-cluster first
# (kubectl not part of this app's own manifests - see the README's
# "Ingress" section for the one-time install + NodePort setup on kind).
#
# Routing:
#   http://<EC2-PUBLIC-IP>:<ingress-nodeport>/       -> frontend Service (port 8080)
#   http://<EC2-PUBLIC-IP>:<ingress-nodeport>/api/*  -> backend Service (port 3000)
#
# No rewrite-target annotation is used: the backend's own Express routes
# are already mounted under /api/* (the same assumption client/nginx.conf's
# own "location /api/ { proxy_pass http://backend:3000; }" proxy already
# relies on - see INC-020), so the full incoming path, /api included, is
# what the backend expects to receive. Rewriting it away would break
# every route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rent-a-ride-ingress
  namespace: rent-a-ride
  annotations:
    # No TLS/cert configured for this kind/EC2 setup - force plain HTTP
    # so ingress-nginx doesn't 308-redirect every request to https before
    # a certificate exists to serve.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # More specific path first for readability - ingress-nginx
          # actually matches by path specificity regardless of listed
          # order, so /api always wins over / for requests under /api,
          # but keeping the specific rule first here avoids ambiguity
          # for anyone reading the file top to bottom.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
