apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rent-a-ride
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Pulled from Docker Hub, pushed by the Jenkins pipeline.
          # Swap :latest for a specific Jenkins BUILD_NUMBER tag for a
          # reproducible rollout.
          image: mykaelhunter/rent-a-ride-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Waits on mongo's Service, not the raw pod - Kubernetes' own
          # readiness gating (mongo's readinessProbe) plus this backend
          # probe hitting /healthz (which itself checks Mongo connectivity,
          # per backend/server.js) is what stands in for docker-compose's
          # depends_on: condition: service_healthy.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# ClusterIP - the frontend's nginx.conf proxies /api/ to
# "http://backend:3000", so this Service must be named "backend" in the
# same namespace for that in-cluster DNS lookup to resolve.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rent-a-ride
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
---
# NodePort - exposes the backend directly for debugging/direct API access
# from outside the cluster at http://<EC2-PUBLIC-IP>:30300. The frontend
# itself does NOT use this; it talks to the ClusterIP Service above.
apiVersion: v1
kind: Service
metadata:
  name: backend-external
  namespace: rent-a-ride
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
