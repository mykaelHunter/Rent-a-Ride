# Non-secret backend config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rent-a-ride
data:
  PORT: "3000"
  LOG_LEVEL: "info"
  # Frontend is reachable at the EC2 host's public IP on NodePort 30080 -
  # replace <EC2-PUBLIC-IP> before applying.
  ALLOWED_ORIGINS: "http://<EC2-PUBLIC-IP>:30080"
---
# Secret values the backend needs (mirrors backend/.env.example, plus
# mongo_uri - moved here from the ConfigMap above because it now embeds
# real credentials and can no longer live in plaintext, cluster-readable
# config).
#
# mongo_uri MUST use the same username/password as mongo-credentials in
# 10-mongo-config.yaml, and MONGO_HOST/PORT from mongo-config - i.e. the
# stable per-pod DNS name from the mongo headless Service, not the old
# "mongo" ClusterIP name (a StatefulSet's headless Service has no single
# ClusterIP to route through). Keep both Secrets in sync by hand for now;
# an External Secrets Operator or Vault integration would remove this
# duplication if the credential ever needs to rotate.
#
# DO NOT commit this file with real values filled in.
#
# Fill in the stringData values below, or skip this file entirely and
# create the secret imperatively instead, e.g.:
#   kubectl create secret generic backend-secret -n rent-a-ride \
#     --from-literal=mongo_uri='mongodb://<user>:<password>@mongo-0.mongo.rent-a-ride.svc.cluster.local:27017/rent-a-ride?authSource=admin' \
#     --from-literal=ACCESS_TOKEN=... \
#     --from-literal=REFRESH_TOKEN=... \
#     --from-literal=CLOUD_NAME=... \
#     --from-literal=API_KEY=... \
#     --from-literal=API_SECRET=... \
#     --from-literal=EMAIL_HOST=... \
#     --from-literal=EMAIL_PASSWORD=... \
#     --from-literal=RAZORPAY_KEY_ID=... \
#     --from-literal=RAZORPAY_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: rent-a-ride
type: Opaque
stringData:
  mongo_uri: "mongodb://REPLACE_ME_USER:REPLACE_ME_PASSWORD@mongo-0.mongo.rent-a-ride.svc.cluster.local:27017/rent-a-ride?authSource=admin"
  ACCESS_TOKEN: "REPLACE_ME"
  REFRESH_TOKEN: "REPLACE_ME"
  CLOUD_NAME: "REPLACE_ME"
  API_KEY: "REPLACE_ME"
  API_SECRET: "REPLACE_ME"
  EMAIL_HOST: "REPLACE_ME"
  EMAIL_PASSWORD: "REPLACE_ME"
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_SECRET: "REPLACE_ME"
