apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: rent-a-ride
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # kind ships the "standard" storageClass (rancher local-path-provisioner)
  # by default, so no storageClassName override is needed here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: rent-a-ride
  labels:
    app: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate   # avoid two mongod pods fighting over the same PVC
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
---
# ClusterIP service - only reachable inside the cluster, at the DNS name
# "mongo" (or "mongo.rent-a-ride.svc.cluster.local" from other namespaces).
# This is the same hostname backend/.env's mongo_uri already expects.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: rent-a-ride
  labels:
    app: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
