apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

    @INCLUDE application-log.conf

  application-log.conf: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Parser              cri
        DB                  /var/log/flb_kube.db
        Mem_Buf_Limit       10MB
        Skip_Long_Lines     On
        Refresh_Interval    10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # Re-tag rent-a-ride namespace records (backend/frontend/mongo) as
    # "app.*" so each record lands in exactly one CloudWatch log group —
    # OUTPUT match rules are independent in Fluent Bit, so without this a
    # rent-a-ride record matching both a specific and a catch-all Match
    # would be shipped twice.
    [FILTER]
        Name                rewrite_tag
        Match               kube.var.log.containers.*_rent-a-ride_*
        Rule                $kubernetes['namespace_name'] rent-a-ride app.$TAG false
        Emitter_Name        re_emitted

    [FILTER]
        Name                grep
        Match               kube.var.log.containers.*_rent-a-ride_*
        Exclude             $kubernetes['namespace_name'] rent-a-ride

    [OUTPUT]
        Name                cloudwatch_logs
        Match               app.*
        region              ${AWS_REGION}
        log_group_name      /rent-a-ride/kubernetes/app
        log_stream_prefix   ${HOST_NAME}-
        auto_create_group   false

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              ${AWS_REGION}
        log_group_name      /rent-a-ride/kubernetes/cluster
        log_stream_prefix   ${HOST_NAME}-
        auto_create_group   true
        log_retention_days  7

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    # kind's nodes run containerd, not dockerd - /var/log/containers/*.log
    # lines are in CRI format ("<time> <stream> <tag> <message>"), not the
    # Docker JSON format the "docker" parser above expects. Using the wrong
    # one silently fails to extract the message, leaving the whole raw CRI
    # line (including this prefix) as one unparsed string, which then
    # can't be JSON-merged by the kubernetes filter downstream.
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
