server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Reverse proxy for /api so the app's same-origin fetch("/api/...")
    # calls reach the backend container. Without this, fetch gets nginx's
    # HTML fallback back instead of JSON, and res.json() throws - which is
    # exactly what caused "something went wrong" on register/sign-in in
    # this compose setup (see docs/incident-log.md INC-020).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (react-router) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
