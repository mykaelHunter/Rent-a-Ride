server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # NOTE: /api/ used to be reverse-proxied to http://backend:3000 here
    # (see docs/incident-log.md INC-020) for the docker-compose setup,
    # where "backend" resolved via Docker's container DNS. On ECS
    # Fargate that hostname doesn't resolve (no service-discovery DNS
    # unless Cloud Map/Service Connect is explicitly configured) - and
    # it's redundant here regardless, since the ALB's listener rule
    # already forwards /api/* straight to the backend target group
    # before the request ever reaches this container. Keeping the old
    # proxy_pass around made nginx fail its startup DNS resolution and
    # crash-loop the whole frontend task.

    # SPA fallback so client-side routes (react-router) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
