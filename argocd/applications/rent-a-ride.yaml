apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rent-a-ride
  namespace: argocd
  annotations:
    # Only the green images are tracked by Image Updater. Blue
    # (backend/frontend) is deliberately NOT in this list - it stays
    # frozen at whatever's in values.yaml until you manually promote a
    # verified green build into it (see values.yaml's rollout comment
    # for the promotion steps). If blue were tracked too, it would climb
    # to the same newest build number as green and there'd be nothing
    # left to compare against.
    argocd-image-updater.argoproj.io/image-list: "backend-green=mykaelhunter/rent-a-ride-backend,frontend-green=mykaelhunter/rent-a-ride-client"

    # Jenkins tags images with the build number (e.g. "47"), not semver -
    # "latest" strategy here means "pick the most recently pushed image",
    # using each tag's creation timestamp rather than trying to parse the
    # tag as a version string. allow-tags excludes the ":latest" tag
    # itself from the candidate pool so it's comparing build-number tags
    # against each other, not against the constantly-overwritten :latest.
    argocd-image-updater.argoproj.io/backend-green.update-strategy: latest
    argocd-image-updater.argoproj.io/backend-green.allow-tags: regexp:^[0-9]+$
    argocd-image-updater.argoproj.io/frontend-green.update-strategy: latest
    argocd-image-updater.argoproj.io/frontend-green.allow-tags: regexp:^[0-9]+$

    # Write updates back into helm/rent-a-ride/values.yaml itself,
    # as a git commit, rather than only as an Argo CD-side parameter
    # override - so `helm template`/`git log` both show the real
    # deployed image on their own, with no Argo CD-specific state
    # required to reconstruct it.
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:values.yaml
    argocd-image-updater.argoproj.io/git-branch: feature/hunter

    # Map each alias to the exact values.yaml keys the Helm chart
    # already reads (see helm/rent-a-ride/values.yaml and the
    # green-stack.yaml template).
    argocd-image-updater.argoproj.io/backend-green.helm.image-name: backendGreen.image.repository
    argocd-image-updater.argoproj.io/backend-green.helm.image-tag: backendGreen.image.tag
    argocd-image-updater.argoproj.io/frontend-green.helm.image-name: frontendGreen.image.repository
    argocd-image-updater.argoproj.io/frontend-green.helm.image-tag: frontendGreen.image.tag
spec:
  project: default

  source:
    repoURL: https://github.com/mykaelHunter/Rent-a-Ride.git
    targetRevision: feature/hunter
    path: helm/rent-a-ride
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    # Not the Application's sync namespace for every resource - the
    # chart's own namespace.yaml template (namespace.create: true) is
    # what actually creates/owns the rent-a-ride Namespace, same as it
    # did under plain `helm install`. This just tells Argo CD where
    # namespaced resources without an explicit namespace should land.
    namespace: rent-a-ride

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # False on purpose - see the destination.namespace comment above.
      # The chart already creates its own Namespace resource; letting
      # Argo CD create one too risks Argo CD and the chart disagreeing
      # about who owns it.
      - CreateNamespace=false
